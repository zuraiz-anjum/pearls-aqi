[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pearls-aqi"
version = "0.3.0"
description = "Three-day AQI forecasting for Lahore on a serverless stack"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
store = ["hopsworks>=3.7,<4.2"]
deep = ["tensorflow>=2.18"]
explain = ["shap>=0.44", "matplotlib>=3.8"]
app = ["streamlit>=1.32", "fastapi>=0.110", "uvicorn>=0.29", "flask>=3.0", "plotly>=5.20", "httpx>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.4", "nbconvert>=7.16", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DTZ", "ISC", "BLE"]
ignore = [
    # Pipelines catch broad exceptions on purpose. A station outage or one bad
    # backfill chunk must degrade the run, not kill it - every one of these logs
    # loudly and carries on, which is the intended behaviour.
    "BLE001",
    # The whole codebase stores UTC-naive timestamps. That is a deliberate
    # convention (Hopsworks event_time wants naive datetime64) enforced in
    # features.prepare_hourly, not an accident these rules would catch.
    "DTZ003",
    "DTZ011",
    # dict(...) reads better than a literal for Plotly's nested layout kwargs.
    "C408",
    "E501",  # line-length is handled by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately import things they only touch inside a single assertion.
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]

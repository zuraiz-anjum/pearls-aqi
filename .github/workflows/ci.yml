name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Forces the parquet feature store and keeps the tests off the network.
      AQI_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # api, not dashboard: Streamlit needs protobuf>=5 and the Hopsworks SDK
        # needs <5, so the dashboard lives in its own environment and is not
        # exercised here. The Flask/FastAPI tests importorskip without this.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Lint
        run: ruff check src app tests

      - name: Test
        run: pytest -q

      - name: Check the pipelines are at least importable
        # Cheap guard against a broken import in a module the tests do not touch,
        # which would otherwise only show up at 02:30 in the training cron.
        run: |
          python -c "
          import aqi.pipelines.backfill
          import aqi.pipelines.feature_pipeline
          import aqi.pipelines.training_pipeline
          import aqi.inference, aqi.alerts, aqi.explain
          import app.api
          print('all modules import cleanly')
          "
